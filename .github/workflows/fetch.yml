name: Fetch Eaglercraft 26.2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download game
        run: |
          curl -L --fail -o index.html "https://ecz-launcher.vercel.app/games/Eaglercraft%2026.2/"
          ls -l index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add Eaglercraft 26.2 as index.html"
          git push
